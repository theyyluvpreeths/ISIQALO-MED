# Production-style stack:  docker compose up --build   →  http://localhost:5000
# Development (hot reload): docker compose -f docker-compose.yml -f docker-compose.dev.yml up
# Secrets come from ./.env (copy .env.example and fill it in).

services:
  azurite:
    # Microsoft's local Azure Blob Storage emulator — stores uploaded PACS files.
    # In production, drop this service and set AZURE_STORAGE_CONNECTION_STRING to a real account.
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: isiqalo_azurite
    command: azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --loose
    ports:
      - "127.0.0.1:10000:10000" # localhost only — lets `npm run dev` outside Docker reach it
    volumes:
      - azurite_data:/data
    restart: unless-stopped

  app:
    build: .
    container_name: isiqalo_app
    depends_on:
      - azurite
    ports:
      - "5000:5000"
    environment:
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:5000}
      # Azurite's well-known, public development account key (not a secret)
      AZURE_STORAGE_CONNECTION_STRING: ${AZURE_STORAGE_CONNECTION_STRING:-DefaultEndpointsProtocol=http;AccountName=devstoreaccount1;AccountKey=Eby8vdM02xNOcqFlqUwJPLlmEtlCDXJ1OUzFT50uSRZ6IFsuFq2UVErCz4I6tq/K1SZFPTOtr/KBHBeksoGMGw==;BlobEndpoint=http://azurite:10000/devstoreaccount1;}
    volumes:
      - app_data:/app/data
      - app_logs:/app/logs
    restart: unless-stopped

volumes:
  azurite_data:
  app_data:
  app_logs:
